name: CI

on:
  push:            # every branch: check a branch before main is moved to it
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Swift tests
        run: swift test
      - name: Build the app
        run: scripts/build.sh
      - name: Shellcheck
        run: |
          brew install shellcheck
          shellcheck -S warning scripts/build.sh
