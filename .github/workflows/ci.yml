name: CI

on:
  push:            # every branch: check a branch before main is moved to it
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Swift tests
        run: swift test --package-path app
      - name: Build the app
        run: app/build.sh
      - name: Shellcheck
        run: |
          brew install shellcheck
          shellcheck -S warning install.sh bin/powerbar raycast/*.sh app/build.sh
      - name: Plugin syntax
        run: /usr/bin/python3 -m py_compile powerbar.py
