name: Release

# Pushing a tag vX.Y.Z builds PowerBar.app from that tag and publishes it as
# PowerBar.zip (plus checksum and build provenance) in a GitHub Release whose
# notes are the matching CHANGELOG.md entry.
on:
  push:
    tags: ['v*']

permissions:
  contents: write       # create the release
  id-token: write       # sign the build provenance
  attestations: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Check the version matches the tag
        run: |
          grep -q "^VERSION=\"${GITHUB_REF_NAME#v}\"$" scripts/build.sh \
            || { echo "scripts/build.sh VERSION does not match $GITHUB_REF_NAME"; exit 1; }
      - name: Test and build
        run: |
          swift test
          scripts/build.sh
          ditto -c -k --keepParent build/PowerBar.app PowerBar.zip
          shasum -a 256 PowerBar.zip > PowerBar.zip.sha256
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: PowerBar.zip
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## " v " " {f=1; next} /^## /{f=0} f' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" PowerBar.zip PowerBar.zip.sha256 \
            --title "PowerBar ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag
